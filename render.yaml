services:
  - type: web
    name: pio-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_TEMPLATE_ID
        value: new-enquiry-notification
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: CONTACT_EMAIL
        value: lodhirahul7002@gmail.com
